# CI - the fail-closed pull-request gate.
#
# Runs only on pull requests to `main`, so the mainline scaffolding push does
# not trigger it. Every PR must build both configurations, pass the host-side
# test subset, and pass the format check before it can merge; the bench step
# is added by the PR that introduces bench/ and becomes part of these
# required checks.

name: CI

on:
  pull_request:
    branches: [main]

# One in-flight run per PR; a newer push cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fail closed: no ambient token scope at the top level; each job re-grants
# the minimum it needs.
permissions: {}

jobs:
  build:
    # The job name is the required-check context in the branch ruleset - keep
    # it stable.
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The exact toolchain the local GPU gate uses - same image, same digest.
    # The runner has no GPU: this job proves both configurations compile
    # and runs the host-side test subset (oracle diffs, negative tests,
    # conformance tests); the on-device ctest results are pasted into each
    # PR from the local container run.
    container:
      image: nvidia/cuda:12.6.2-devel-ubuntu24.04@sha256:738fba0fbdb225b7a2931c58a5c8f03a84d3cd2f6a84975826a157339ef750b8
    permissions:
      contents: read
    defaults:
      run:
        # Explicit bash gets -o pipefail (the default shell does not), so a
        # failing command on the left of a pipe reds the step by itself.
        shell: bash
    steps:
      # Tools BEFORE checkout, and git among them: without git in the
      # container, actions/checkout silently falls back to a REST-API
      # tarball download - the flakier path (it red this gate twice with
      # GitHub-side 5xx pages on 2026-07-16). The image's CUDA apt repo is
      # unused here and a historic false-red vector (the 2022 NVIDIA key
      # rotation broke it fleet-wide) - drop it before updating. Packages
      # come from the signature-verified Ubuntu LTS archive, the same
      # source the local gate command in the README uses.
      - name: Install git and CMake
        run: >-
          rm -f /etc/apt/sources.list.d/cuda*.list &&
          apt-get update -q -o Acquire::Retries=3 &&
          apt-get install -yq -o Acquire::Retries=3 --no-install-recommends
          git cmake

      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure and build (host-only)
        run: cmake -B build && cmake --build build

      # The fail-closed half of CUDEC_ENABLE_HIP (issue #209), gated on every
      # PR without a ROCm runner. Exiting non-zero is not the claim: the claim
      # is that each configure refused FOR THE REASON IT NAMES, and a configure
      # that died on an unrelated typo satisfies a bare exit-code check while
      # proving nothing. So every leg matches the message text.
      #
      # Three legs, and the third is the one that costs something. This image
      # has no HIP toolchain, so legs 1 and 2 only ever exercise the toolchain
      # refusal; the SECOND refusal - the one that stops a decoder-less HIP
      # build on a machine that does have ROCm - would then be gated by
      # nothing. Leg 3 reaches it by handing the configure a compiler, which is
      # why the block probes CMAKE_HIP_COMPILER itself instead of using
      # check_language (that module skips its probe when the variable is
      # already set, and the refusal would be skipped with it).
      #
      # Messages are matched after collapsing whitespace: CMake re-wraps
      # FATAL_ERROR text to its own width, so a phrase can arrive split across
      # lines and a plain grep would pass or fail on where the wrap fell.
      #
      # Everything is written under the runner temp directory, not the
      # checkout: a refused configure leaves a build tree behind, and .gitignore
      # covers the build directories this repo produces on purpose, not these.
      - name: CUDEC_ENABLE_HIP refuses, and names which half is missing
        run: |
          flat() { tr -s '[:space:]' ' ' < "$1"; }
          out="$RUNNER_TEMP/hip-negative"
          mkdir -p "$out"

          # Leg 1: no toolchain anywhere -> the toolchain refusal.
          if cmake -B "$out/no-toolchain" -DCUDEC_ENABLE_HIP=ON \
               > "$out/1.log" 2>&1; then
            echo "FAIL: configure succeeded with no HIP toolchain present"
            cat "$out/1.log"
            exit 1
          fi
          flat "$out/1.log" | grep -q \
            "CUDEC_ENABLE_HIP requires a HIP toolchain" || {
            echo "FAIL: configure failed, but not on the toolchain refusal"
            cat "$out/1.log"
            exit 1
          }

          # Leg 2: the refusal must be re-derived, not remembered. A refused
          # tree may not carry a cached HIP-compiler verdict, or a build
          # directory configured before ROCm was installed would keep saying
          # "none was found" without looking again. check_language(HIP) caches
          # exactly that, which is why the block probes for itself.
          if grep -q "CMAKE_HIP_COMPILER" "$out/no-toolchain/CMakeCache.txt"; then
            echo "FAIL: a HIP compiler verdict was cached in a refused tree"
            grep "CMAKE_HIP_COMPILER" "$out/no-toolchain/CMakeCache.txt"
            exit 1
          fi
          if cmake -B "$out/no-toolchain" -S . > "$out/2.log" 2>&1; then
            echo "FAIL: re-configure of a refused tree succeeded"
            cat "$out/2.log"
            exit 1
          fi
          flat "$out/2.log" | grep -q \
            "CUDEC_ENABLE_HIP requires a HIP toolchain" || {
            echo "FAIL: the re-configure refused for a different reason"
            cat "$out/2.log"
            exit 1
          }

          # Leg 3: a caller-supplied compiler passes the toolchain arm, so the
          # device-sources refusal is the one that must fire. /bin/sh is not a
          # HIP compiler and is not asked to be one - nothing here compiles.
          if cmake -B "$out/no-sources" -DCUDEC_ENABLE_HIP=ON \
               -DCMAKE_HIP_COMPILER=/bin/sh > "$out/3.log" 2>&1; then
            echo "FAIL: configure succeeded with no HIP device sources"
            cat "$out/3.log"
            exit 1
          fi
          flat "$out/3.log" | grep -q \
            "cudec carries no HIP device sources yet" || {
            echo "FAIL: a supplied compiler did not reach the sources refusal"
            cat "$out/3.log"
            exit 1
          }

          cat "$out/1.log" "$out/2.log" "$out/3.log"

      # The mutual exclusion, same shape: two device backends in one build tree
      # would give two definitions of the decode symbols and a link whose
      # winner depends on ordering. It refuses before either language is
      # enabled, so this leg needs neither toolchain. The matched phrase is the
      # long one rather than "mutually exclusive": the short phrase would also
      # match a future unrelated refusal and would stop distinguishing.
      - name: CUDEC_ENABLE_CUDA and CUDEC_ENABLE_HIP refuse each other
        run: |
          out="$RUNNER_TEMP/both-negative"
          if cmake -B "$out" -DCUDEC_ENABLE_CUDA=ON -DCUDEC_ENABLE_HIP=ON \
               > "$out.log" 2>&1; then
            echo "FAIL: configure accepted both device backends at once"
            cat "$out.log"
            exit 1
          fi
          tr -s '[:space:]' ' ' < "$out.log" | grep -q \
            "mutually exclusive: one device backend per build tree" || {
            echo "FAIL: configure failed, but not on the mutual exclusion"
            cat "$out.log"
            exit 1
          }
          cat "$out.log"

      # The versions the consumer legs request are derived here, from
      # include/cudec.h - the one place the version is written, and the same
      # three macros the top-level CMakeLists reads to set the project version.
      # A literal was wrong for the whole life of the 0.1.0 bump: the accept
      # leg asked for 0.0.1, which SameMinorVersion refuses once the minor
      # moves, and nothing caught it because the consumer steps arrived after
      # that bump's own run (issue #307).
      #
      # Fail-closed on the parse rather than on the request. An empty capture
      # would reach find_package as no version at all, and config mode then
      # never opens cudec-config-version.cmake - so the legs would pass against
      # a prefix carrying no version file, which is the hole they exist to
      # close. A component that is absent, non-numeric, or matched twice reds
      # here instead.
      - name: Derive the requested versions from the version's single source
        run: |
          component() {
            sed -n "s/^#define CUDEC_VERSION_$1 \([0-9][0-9]*\)$/\1/p" \
              include/cudec.h
          }
          major="$(component MAJOR)"
          minor="$(component MINOR)"
          patch="$(component PATCH)"
          for part in "$major" "$minor" "$patch"; do
            case "$part" in
              "" | *[!0-9]*)
                echo "FAIL: include/cudec.h did not yield three integer" \
                     "version components (major='$major' minor='$minor'" \
                     "patch='$patch')"
                exit 1
                ;;
            esac
          done
          echo "CUDEC_VERSION=$major.$minor.$patch" >> "$GITHUB_ENV"
          echo "CUDEC_VERSION_ABOVE_MINOR=$major.$((minor + 1))" \
            >> "$GITHUB_ENV"
          echo "accept: $major.$minor.$patch"
          echo "refuse: $major.$((minor + 1))"

      # The install surface is proven by consuming it, never by inspecting it
      # (issue #79). Install the host-only build into a prefix, then configure,
      # build AND RUN a project outside this tree that knows nothing but
      # find_package(cudec) - so a broken export set, a header installed where
      # the exported include interface does not point, or a package config that
      # never reaches the targets file reds this gate.
      #
      # It runs rather than only links because an archive can carry a symbol
      # the consumer never actually reaches; cudec_version() touches no device,
      # so the GPU-less runner can execute it. Fail-closed on the two files the
      # consumer would otherwise fail on with a worse message, and the config
      # is located rather than assumed at lib/ - GNUInstallDirs is free to put
      # it under lib64 on another distribution.
      #
      # The consumer is driven TWICE, and both runs pass a version, because
      # config mode reads cudec-config-version.cmake only when the caller
      # requests one: a no-version consumer configures happily against a prefix
      # whose version file was never installed. The installed version must be
      # accepted, the next minor above it must be refused, and the refusal leg
      # reds if that configure SUCCEEDS. Both requests come from the step above
      # rather than from a literal, so a bump carries them with it.
      #
      # What that pair does NOT prove, stated so the gate is not read as
      # stronger than it is: the refused request sits above the installed
      # version, and SameMajorVersion and AnyNewerVersion refuse such a request
      # as well, so the pair does not say which mode is configured. That
      # follows from what the generated version file compares, not from a run
      # here. The request that would separate the modes is the same major with
      # a LOWER minor, which only SameMinorVersion refuses; it exists only
      # while the minor is above zero, so it is not derivable for every version
      # and is not added here. What the legs do prove is that the version file
      # is installed and consulted - dropping it from the install reds the step
      # - and that a minor mismatch is refused.
      - name: Install and consume out of tree (host-only)
        run: >-
          cmake --install build --prefix "$PWD/prefix-host" &&
          test -f "$PWD/prefix-host/include/cudec.h" &&
          test -n "$(find "$PWD/prefix-host" -name cudec-config.cmake
          -print -quit)" &&
          test -n "$(find "$PWD/prefix-host" -name cudec-config-version.cmake
          -print -quit)" &&
          cmake -S tests/consumer -B build-consumer
          -DCMAKE_PREFIX_PATH="$PWD/prefix-host"
          -DCUDEC_CONSUMER_REQUEST_VERSION="$CUDEC_VERSION" &&
          cmake --build build-consumer &&
          ./build-consumer/consumer &&
          if cmake -S tests/consumer -B build-consumer-badver
          -DCMAKE_PREFIX_PATH="$PWD/prefix-host"
          -DCUDEC_CONSUMER_REQUEST_VERSION="$CUDEC_VERSION_ABOVE_MINOR"
          > badver.log 2>&1; then
          echo "FAIL: find_package(cudec $CUDEC_VERSION_ABOVE_MINOR) was
          accepted against a $CUDEC_VERSION prefix - the version policy is not
          being applied"; exit 1; else
          echo "PASS: find_package(cudec $CUDEC_VERSION_ABOVE_MINOR) refused
          against a $CUDEC_VERSION prefix";
          fi

      # Unconditional AND self-verifying: the GPU-test binaries exist only
      # if the CUDA configuration actually built the device TUs, so a
      # renamed CMake option cannot quietly turn this step into a green
      # host-only build (-D on an unknown option is a warning, not an
      # error).
      - name: Configure and build (CUDA engine)
        run: >-
          cmake -B build-cuda -DCUDEC_ENABLE_CUDA=ON &&
          cmake --build build-cuda -j &&
          test -x build-cuda/tests/smoke &&
          test -x build-cuda/tests/gpu_fixture &&
          test -x build-cuda/tests/frame_twin &&
          test -x build-cuda/tests/stream_twin &&
          test -x build-cuda/tests/termination_gpu &&
          test -x build-cuda/tests/determinism_gpu &&
          test -x build-cuda/tests/snappy_block_device &&
          test -x build-cuda/examples/example_decode_frame &&
          test -x build-cuda/examples/example_decode_batch

      # The other half of the install proof (issue #137). The host-only prefix
      # is the easy flavour: nothing reaches the exported interface. The CUDA
      # one carries $<LINK_ONLY:CUDA::cudart>, so the consumer needs the
      # package config to hand it find_dependency(CUDAToolkit) before the
      # targets file is read - and the failure without it lands at the generate
      # step, AFTER find_package(cudec) has already reported success.
      #
      # The runner has no GPU and does not need one: cudec_version() links and
      # runs without touching a device, which is exactly what proves the
      # imported target resolved.
      #
      # The consumer knows nothing about CUDA. That is the point of the step -
      # a consumer that called find_package(CUDAToolkit) itself would paper
      # over the missing dependency and prove nothing about the package.
      # The assertion is on the substituted guard, not on the presence of the
      # find_dependency line: both flavours ship the same conditional block and
      # only the guard differs, so grepping for the call itself would pass
      # against a host-only prefix too and prove nothing. The guard is
      # normalised to 1/0 in CMakeLists.txt so this is not an assertion about
      # which spelling of a boolean the configure happened to use.
      #
      # The consumer calls a decode entry point here, not only cudec_version().
      # A CUDA-flavoured archive carries the C++ host orchestration alongside
      # the one C translation unit, and a link that pulls only the latter proves
      # the target name resolved and nothing about the rest of the link surface.
      - name: Install and consume out of tree (CUDA engine)
        run: >-
          cmake --install build-cuda --prefix "$PWD/prefix-cuda" &&
          grep -q "^if(1)$"
          "$(find "$PWD/prefix-cuda" -name cudec-config.cmake -print -quit)" &&
          cmake -S tests/consumer -B build-consumer-cuda
          -DCMAKE_PREFIX_PATH="$PWD/prefix-cuda"
          -DCUDEC_CONSUMER_REQUEST_VERSION="$CUDEC_VERSION"
          -DCUDEC_CONSUMER_CALLS_DECODE=ON &&
          cmake --build build-consumer-cuda &&
          ./build-consumer-cuda/consumer

      # The guard is conditional, and this is the half that says so. A
      # host-only prefix must not ask its consumer for a CUDA toolkit that
      # consumer may not have.
      #
      # Two legs. The installed config carries the guard as 0, and the consumer
      # configures against it in an environment stripped of every route to the
      # toolkit: PATH without the CUDA bin directory, CUDAToolkit_ROOT pointed
      # at nothing, and the CUDA prefix ignored. That is a real absent-toolkit
      # simulation rather than CMAKE_DISABLE_FIND_PACKAGE_CUDAToolkit, which
      # does not make anything undiscoverable - against the REQUIRED call that
      # find_dependency emits, CMake refuses the disable request itself and the
      # step would red on the wrong rule.
      - name: The host-only package stays CUDA-free
        run: >-
          grep -q "^if(0)$"
          "$(find "$PWD/prefix-host" -name cudec-config.cmake -print -quit)" &&
          env -i PATH=/usr/bin:/bin HOME="$HOME"
          cmake -S tests/consumer -B build-consumer-nocuda
          -DCMAKE_PREFIX_PATH="$PWD/prefix-host"
          -DCUDEC_CONSUMER_REQUEST_VERSION="$CUDEC_VERSION"
          -DCUDAToolkit_ROOT=/nonexistent
          -DCMAKE_IGNORE_PREFIX_PATH=/usr/local/cuda &&
          cmake --build build-consumer-nocuda &&
          ./build-consumer-nocuda/consumer

      # The host-side subset; gpu-labeled tests run in this same container
      # on the maintainer's machine and their output is pasted into the PR.
      # Fail-closed plumbing: --no-tests=error reds a vacuous zero-test
      # selection, and the identity greps pin BOTH sets by name - a known
      # host test silently dropping out of the CI selection (say, by
      # gaining a gpu-matching label) reds the gate exactly like a known
      # GPU test vanishing from the deferred listing.
      - name: Host-side tests (runner has no GPU)
        run: >-
          ctest --test-dir build-cuda -LE gpu --no-tests=error
          --output-on-failure &&
          ctest --test-dir build-cuda -LE gpu -N | tee host-selected.txt &&
          grep -E ': conformance_c$' host-selected.txt &&
          grep -E ': oracle_lz4$' host-selected.txt &&
          grep -E ': parser_twin$' host-selected.txt &&
          grep -E ': snappy_parser_twin$' host-selected.txt &&
          grep -E ': tilestream_host_negative$' host-selected.txt &&
          grep -E ': termination$' host-selected.txt &&
          grep -E ': launch_fail$' host-selected.txt &&
          grep -E ': bench_selfcheck$' host-selected.txt &&
          grep -E ': bench_worst4b_selfcheck$' host-selected.txt &&
          grep -E ': oracle_gdeflate$' host-selected.txt &&
          grep -E ': gdeflate_probes$' host-selected.txt &&
          grep -E ': gdeflate_schedule_twin$' host-selected.txt &&
          grep -E ': gdeflate_header_twin$' host-selected.txt &&
          echo "Deferred to the local GPU gate:" &&
          ctest --test-dir build-cuda -L gpu -N | tee gpu-deferred.txt &&
          grep -E ': smoke$' gpu-deferred.txt &&
          grep -E ': gpu_fixture$' gpu-deferred.txt &&
          grep -E ': frame_twin$' gpu-deferred.txt &&
          grep -E ': stream_twin$' gpu-deferred.txt &&
          grep -E ': termination_gpu$' gpu-deferred.txt &&
          grep -E ': determinism_gpu$' gpu-deferred.txt &&
          grep -E ': snappy_block_device$' gpu-deferred.txt

  sanitize:
    # The host-side ASan/UBSan gate over the untrusted-input decode path (issue
    # #42): builds only the GPU-less, host-instrumentable subset (the frame
    # parse, the single-sourced block parser via the CPU twin, and the C-ABI
    # argument validation) with AddressSanitizer + UndefinedBehaviorSanitizer,
    # and runs the negative/mutation/oracle/conformance tests under it, so an
    # out-of-bounds access, an uninitialised read, or integer/shift UB on a
    # hostile bitstream reds the build. The sanitizer never touches nvcc/device
    # compilation (CUDEC_SANITIZE guards it to the host C/C++ path); the device
    # net stays compute-sanitizer + the whole-corpus GPU/oracle byte diff.
    name: sanitize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same pinned image/digest as build: nvcc is present (the library's device
    # TU still compiles) and the runner has no GPU (the sanitized subset rejects
    # or decodes all-uncompressed frames before any CUDA call).
    container:
      image: nvidia/cuda:12.6.2-devel-ubuntu24.04@sha256:738fba0fbdb225b7a2931c58a5c8f03a84d3cd2f6a84975826a157339ef750b8
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      # Same git-before-checkout lesson as the build job: git in the container
      # keeps actions/checkout off the flakier REST-tarball fallback, and the
      # CUDA apt repo is dropped before the update.
      - name: Install git and CMake
        run: >-
          rm -f /etc/apt/sources.list.d/cuda*.list &&
          apt-get update -q -o Acquire::Retries=3 &&
          apt-get install -yq -o Acquire::Retries=3 --no-install-recommends
          git cmake

      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Host-only subset with the sanitizers on. The GPU tests and bench are
      # skipped by the CMake gate (they are nvcc-linked), so the build is pure
      # host. The test -x lines are fail-closed: every sanitized binary must
      # exist, so a build that silently stopped producing one reds here.
      - name: Build the host attack surface with ASan+UBSan
        run: >-
          cmake -B build-san -DCUDEC_ENABLE_CUDA=ON
          -DCUDEC_SANITIZE=address,undefined &&
          cmake --build build-san -j &&
          test -x build-san/tests/conformance_c &&
          test -x build-san/tests/oracle_lz4 &&
          test -x build-san/tests/parser_twin &&
          test -x build-san/tests/snappy_parser_twin &&
          test -x build-san/tests/frame_host_negative &&
          test -x build-san/tests/tilestream_host_negative &&
          test -x build-san/tests/gdeflate_schedule_twin &&
          test -x build-san/tests/gdeflate_tables_twin &&
          test -x build-san/tests/gdeflate_header_twin &&
          test -x build-san/tests/zstd_exec_twin &&
          test -x build-san/tests/zstd_blocks_twin &&
          test -x build-san/tests/termination

      # Prove the sanitizer runtimes are actually linked: a dropped or renamed
      # -fsanitize flag would still build and test green but check nothing, so
      # pin it empirically here - a sanitized binary links libasan and libubsan.
      - name: Verify the sanitizer runtimes are linked
        run: >-
          ldd build-san/tests/parser_twin | grep -q libasan &&
          ldd build-san/tests/parser_twin | grep -q libubsan

      # Run the untrusted-input subset under the sanitizers. --no-tests=error
      # reds a vacuous selection; the regex pins exactly the host tests this
      # gate owns (launch_fail and bench are excluded: they initialise the CUDA
      # runtime / are nvcc-linked, outside the host attack surface). The
      # per-name identity greps mirror the build job: --no-tests=error only
      # reds on a ZERO selection, so a single sanitized test silently losing
      # its registration (say, by gaining a gpu-matching label) would shrink
      # the set unnoticed - the greps pin every one by name so that reds too.
      - name: Run the untrusted-input decode path under ASan+UBSan
        run: >-
          ctest --test-dir build-san --no-tests=error --output-on-failure -R
          '^(conformance_c|oracle_lz4|parser_twin|snappy_parser_twin|snappy_edge_sweep|snappy_upstream_negatives|frame_host_negative|tilestream_host_negative|gdeflate_schedule_twin|gdeflate_tables_twin|gdeflate_header_twin|zstd_frame_twin|zstd_exec_twin|zstd_blocks_twin|termination)$'
          &&
          ctest --test-dir build-san -N | tee san-selected.txt &&
          grep -E ': conformance_c$' san-selected.txt &&
          grep -E ': oracle_lz4$' san-selected.txt &&
          grep -E ': parser_twin$' san-selected.txt &&
          grep -E ': snappy_parser_twin$' san-selected.txt &&
          grep -E ': snappy_edge_sweep$' san-selected.txt &&
          grep -E ': snappy_upstream_negatives$' san-selected.txt &&
          grep -E ': frame_host_negative$' san-selected.txt &&
          grep -E ': tilestream_host_negative$' san-selected.txt &&
          grep -E ': gdeflate_schedule_twin$' san-selected.txt &&
          grep -E ': gdeflate_tables_twin$' san-selected.txt &&
          grep -E ': gdeflate_header_twin$' san-selected.txt &&
          grep -E ': zstd_frame_twin$' san-selected.txt &&
          grep -E ': zstd_exec_twin$' san-selected.txt &&
          grep -E ': zstd_blocks_twin$' san-selected.txt &&
          grep -E ': termination$' san-selected.txt

  format:
    name: format
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read-only, and needed by one step: a document may declare a path the
      # tree owes as `path` (planned: #NNN), and that declaration is judged
      # against the issue's state. No declaration exists today, so nothing
      # here calls the tracker yet; the grant is what keeps the first one
      # from erroring instead of being judged.
      issues: read
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prettier check
        run: npx --yes prettier@3 --check "**/*.{md,yml,yaml}"

      # A Dependabot config the platform rejects is refused here rather than
      # failing silently (issue #232). GitHub parses .github/dependabot.yml on
      # its own schedule and reports a rejection nowhere this repository can
      # read, so a misspelled key looks configured while the setting it names
      # is not in force. The step above already reds an unparseable file - it
      # is the YAML parser in this job - and passes a well-formed file whose
      # keys the platform does not know.
      #
      # The route, the schema pin, the exact validator versions and the
      # self-test that keeps the check from passing vacuously are argued in
      # the script's own header, next to the constants they are about.
      - name: Dependabot config validates against the published schema
        run: scripts/check-dependabot-config.sh

      # A tense-present document naming a repository path the tree does not
      # hold is refused here (issue #397). Three such corrections landed by
      # hand in one night - #391, #393, #395 - and nothing in this repository
      # would have found any of them.
      #
      # IT REACHES ONE THIRD OF THAT CLASS, AND A GREEN RUN IS NOT "NO
      # DOCUMENT CONTRADICTS THE TREE". #393 and #395 are claims about state
      # rather than references to files, and no reading of a path reaches
      # either. The two properties it does hold, the three carve-outs, and the
      # population each one meets are argued in the script's own header beside
      # the code that decides them, and the self-tests that keep it from
      # passing vacuously run on every invocation.
      - name: Every path a tense-present document names resolves
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-doc-paths.sh

      # Every Action pinned to a full commit SHA, enforced rather than swept
      # (issue #131). A tag or branch pin resolves to whatever the upstream
      # owner points it at later, which is the supply-chain hole the pinning
      # rule exists to close; the audit was clean and only the mechanism that
      # keeps it clean was missing.
      #
      # Shell rather than a pin-audit Action, per the masterplan's preference
      # for near-zero third-party surface in the security net itself: an Action
      # that checks the pinning of Actions is one more pinned dependency to
      # keep current, and this rule is one regex.
      #
      # Fail-closed like the rest of this file: no workflow files, or workflow
      # files with no `uses:` at all, means the check is reading the wrong
      # place - it reds rather than passes silently.
      - name: Every Action pinned to a full commit SHA
        run: |
          set -eu
          find .github/workflows -type f -name '*.yml' > workflow-files.txt
          find .github/workflows -type f -name '*.yaml' >> workflow-files.txt
          sort -o workflow-files.txt workflow-files.txt
          if [ ! -s workflow-files.txt ]; then
            echo "FAIL: no workflow files under .github/workflows"
            exit 1
          fi
          # shellcheck disable=SC2046
          grep -nE '^[[:space:]]*(-[[:space:]]+)?uses:' $(cat workflow-files.txt) > action-refs.txt || true
          if [ ! -s action-refs.txt ]; then
            echo "FAIL: no 'uses:' line in any workflow - this check is reading the wrong files"
            exit 1
          fi
          # The version comment goes first, so the 40-hex anchor sits at the end
          # of the line. Local actions (./...) and docker:// references have no
          # commit to pin; a reusable workflow
          # (owner/repo/.github/workflows/x.yml@SHA) must still be pinned and
          # matches the same pattern.
          sed 's/#.*$//; s/[[:space:]]*$//' action-refs.txt > refs-bare.txt
          grep -vE "uses:[[:space:]]*\./" refs-bare.txt > refs-remote.txt || true
          grep -vE "uses:[[:space:]]*docker://" refs-remote.txt > refs-actions.txt || true
          grep -vE "uses:[[:space:]]*[^[:space:]@]+@[0-9a-f]{40}$" refs-actions.txt > unpinned.txt || true
          if [ -s unpinned.txt ]; then
            echo "FAIL: Action reference not pinned to a full 40-character commit SHA:"
            cat unpinned.txt
            exit 1
          fi
          echo "PASS: $(wc -l < action-refs.txt) Action reference(s) across $(wc -l < workflow-files.txt) workflow file(s), all SHA-pinned"
